[project]
name = "flightlab"
version = "1.0.0"
description = "NumPy-first linear flight-control experiments, campaigns, and verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Victor Santiago Paulino", email = "santiagopaulinov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
]

[project.urls]
Changelog = "https://github.com/santiagopaulinov-wq/FlightLab/blob/main/CHANGELOG.md"
Repository = "https://github.com/santiagopaulinov-wq/FlightLab"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scipy>=1.18.0,<1.19",
]

[tool.uv.build-backend]
source-include = [
    ".python-version",
    "CHANGELOG.md",
    "NEXT.md",
    "ROADMAP.md",
    "docs/**",
    "examples/**",
    "tests/**",
    "uv.lock",
]
